<form class="composer" id="chat-form">
    <label class="sr-only" for="prompt-input">پیام خود را بنویسید</label>
    <textarea id="prompt-input" name="prompt" rows="1" placeholder="هر چیزی که توی ذهنته، بپرس…" required></textarea>
    <input type="hidden" id="csrf-token" value="{{ csrf_token }}">
    <input type="hidden" id="form-type" value="{% if create %}create{% else %}append{% endif %}">
    <div class="composer-tools">
        <div class="tool-group">
            <button class="tool-button" type="button" aria-label="افزودن فایل" title="افزودن فایل"><svg
                    viewBox="0 0 24 24">
                    <path d="M12 5v14M5 12h14" />
                </svg></button>
            <span class="tool-divider"></span>
            <button class="mode-button" type="button"><span class="mode-spark">✳</span> فکر عمیق <span
                    class="chevron">⌄</span></button>
        </div>
        <div class="tool-group">
            <span class="model-label"><span class="status-dot"></span> مدل پیش‌فرض</span>
            <button class="send-button" type="submit" aria-label="ارسال پیام"><svg viewBox="0 0 24 24">
                    <path d="m5 12 14-7-5 14-2.5-5.5L5 12Z" />
                    <path d="m11.5 13.5 4-4" />
                </svg></button>
        </div>
    </div>
</form>
