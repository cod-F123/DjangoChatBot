<div class="confirm-modal" id="delete-confirm-modal" role="dialog" aria-modal="true" aria-labelledby="delete-confirm-title" aria-describedby="delete-confirm-description" hidden>
  <div class="confirm-modal-backdrop" data-confirm-close></div>
  <div class="confirm-modal-card" role="document">
    <button class="confirm-modal-close" type="button" aria-label="بستن" data-confirm-close>×</button>
    <div class="confirm-modal-icon" aria-hidden="true">⌫</div>
    <h2 id="delete-confirm-title">حذف گفتگو</h2>
    <p id="delete-confirm-description">آیا از حذف این گفتگو مطمئن هستید؟ این عملیات قابل بازگشت نیست.</p>
    <div class="confirm-modal-actions">
      <button class="confirm-modal-cancel" type="button" data-confirm-close>انصراف</button>
      <button class="confirm-modal-delete" type="button" data-confirm-delete>حذف گفتگو</button>
    </div>
  </div>
</div>
