{% load static %}
<!doctype html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f7f4">
    <script>
        (() => {
            let savedTheme = null;
            try { savedTheme = localStorage.getItem('chatbot-theme'); } catch (_) { }
            const prefersDark = window.matchMedia?.('(prefers-color-scheme: dark)').matches;
            const theme = savedTheme === 'dark' || savedTheme === 'light' ? savedTheme : (prefersDark ? 'dark' : 'light');
            document.documentElement.dataset.theme = theme;
            document.querySelector('meta[name="theme-color"]')?.setAttribute('content', theme === 'dark' ? '#111713' : '#f7f7f4');
        })();
    </script>
    <title>{% block title %}هم‌صحبت — دستیار هوشمند{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'django_cotton_ui/cotton-ui.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/css/app.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/css/sidebar.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/css/loading.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/css/socket.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/css/chat-layout.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/css/markdown.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/css/attachments.css' %}">
    <link rel="stylesheet" href="{% static 'chatbot/css/theme.css' %}">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.css" integrity="sha384-3rdsX6e5mueWyoweR9NIVmtEsUkokpBT/0ALqKKIBMr9j4qhHkaIkAcGgsE6uVlp" crossorigin="anonymous">
    {% block extra_head %}{% endblock %}
</head>

<body>
    {% block content %}{% endblock %}
    <script defer src="{% static 'django_cotton_ui/cotton-ui.min.js' %}"></script>
    <script defer src="{% static 'chatbot/js/vendor/marked.umd.js' %}"></script>
    <script defer src="{% static 'chatbot/js/vendor/purify.min.js' %}"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/katex.min.js" integrity="sha384-QFFtAGzvvj+bfgCGxXJlNZZR1nXEZgvG8tDLCCY1F19xl20WlfTYgguB4VcNdxYk" crossorigin="anonymous"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/katex@0.19.0/dist/contrib/auto-render.min.js" integrity="sha384-bjyGPfbij8/NDKJhSGZNP/khQVgtHUE5exjm4Ydllo42FwIgYsdLO2lXGmRBf5Mz" crossorigin="anonymous"></script>
    <script defer src="{% static 'chatbot/js/markdown.js' %}"></script>
    <script defer src="{% static 'chatbot/js/theme.js' %}"></script>
    <script defer src="{% static 'chatbot/js/app.js' %}"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"
        integrity="sha512-8LENNbXmzI/Gbj+OwXmqR6V4QaUAw0/porPzy1+dQoJqC0JPHedWoe0DDOTL2uHA5XXJyIsPtiMHH86pVlay6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer"></script>
    {% block scripts %}{% endblock %}
</body>

</html>
